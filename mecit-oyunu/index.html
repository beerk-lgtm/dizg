<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8f3a22">
<title>Mecit Abi</title>
<link rel="apple-touch-icon" href="assets/mecit.png">
<link rel="icon" href="assets/mecit.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --kagit:#f6eedb; --kagit2:#efe2c4; --murekkep:#2b2118; --kazak:#9a3f25; --kazak2:#c25a35;
  --yesil:#2f8f5b; --kirmizi:#c0392b; --mavi:#2d6cdf; --sari:#f2c14e; --gri:#8a8070;
  --golge:0 4px 0 rgba(43,33,24,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2b2118;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--murekkep);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:relative;margin:0 auto;max-width:480px;height:100vh;height:100dvh;overflow:hidden;
  background:var(--kagit);background-image:radial-gradient(rgba(154,63,37,.06) 1px,transparent 1px);background-size:14px 14px;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ekran{position:absolute;inset:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}
h1,h2,h3,.baloo{font-family:"Baloo 2",system-ui,sans-serif;margin:0;line-height:1.05}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}
.btn{background:var(--kazak);color:#fff;font-family:"Baloo 2",system-ui;font-weight:800;font-size:20px;
  padding:12px 22px;border-radius:16px;box-shadow:var(--golge);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,33,24,.25)}
.btn.ikincil{background:#fff;color:var(--murekkep);border:2px solid var(--murekkep)}
.btn.yesil{background:var(--yesil)} .btn.kirmizi{background:var(--kirmizi)}
.btn:disabled{opacity:.45}
.ust{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
.ust .geri{background:#fff;border:2px solid var(--murekkep);border-radius:12px;width:40px;height:40px;font-size:20px;line-height:1}
.ust .baslik{flex:1;min-width:0;font-family:"Baloo 2";font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:#fff;border:2px solid var(--murekkep);border-radius:999px;padding:3px 10px;font-weight:800;font-size:15px;white-space:nowrap}
.chip.sure{min-width:62px;text-align:center}
.chip.uyari{background:var(--kirmizi);color:#fff;border-color:var(--kirmizi);animation:nabiz .5s infinite alternate}
@keyframes nabiz{to{transform:scale(1.08)}}
.balon{position:relative;background:#fff;border:2.5px solid var(--murekkep);border-radius:18px;padding:9px 13px;font-weight:600;font-size:15px;line-height:1.3;box-shadow:var(--golge)}
.balon.pop{animation:pop .25s ease-out}
@keyframes pop{0%{scale:.7;opacity:0}80%{scale:1.05}100%{scale:1;opacity:1}}
.yuz{display:block;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.sallan{animation:sallan 1.2s ease-in-out infinite alternate}
@keyframes sallan{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.titre{animation:titre .3s}
@keyframes titre{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.ucan{position:absolute;pointer-events:none;font-family:"Baloo 2";font-weight:800;font-size:22px;animation:ucan .9s ease-out forwards;z-index:50;white-space:nowrap;text-shadow:0 2px 0 #fff}
@keyframes ucan{to{transform:translateY(-60px);opacity:0}}
.emoji{font-size:44px;line-height:1}

/* Başlık ekranı */
.kapak{align-items:center;justify-content:space-between;padding:22px 18px 26px;text-align:center;
  background:linear-gradient(180deg,#f6eedb 0%,#f6eedb 55%,#e9d3a8 100%)}
.kapak h1{font-size:54px;color:var(--kazak);text-shadow:3px 3px 0 var(--murekkep);letter-spacing:.5px}
.kapak .alt{font-family:"Baloo 2";font-weight:800;font-size:20px;margin-top:4px}
.kapak .govde{height:44vh;max-height:380px;position:relative}
.kapak .govde img{height:100%}
.kapak .govde .balon{position:absolute;top:30%;right:-30%;width:140px;transform:rotate(4deg);font-size:14px}
.damga{display:inline-block;border:3px solid var(--kirmizi);color:var(--kirmizi);font-family:"Baloo 2";font-weight:800;padding:2px 10px;border-radius:8px;transform:rotate(-8deg);font-size:16px;background:rgba(255,255,255,.6)}

/* Hafta ekranı */
.hafta{padding:0 14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
.gun{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--murekkep);border-radius:18px;padding:10px 12px;box-shadow:var(--golge);text-align:left;width:100%}
.gun .ikon{font-size:34px;width:46px;text-align:center}
.gun .bilgi{flex:1}
.gun .gunad{font-size:12px;font-weight:800;color:var(--kazak);text-transform:uppercase;letter-spacing:1px}
.gun .oyunad{font-family:"Baloo 2";font-weight:800;font-size:19px}
.gun .yildiz{font-size:18px;letter-spacing:-2px}
.gun.kilit{opacity:.5;filter:grayscale(1)}
.toplam{display:flex;justify-content:space-between;align-items:center;padding:4px 16px 8px;font-weight:800}

/* Giriş kartı */
.giris{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;text-align:center}
.giris .gkart{background:#fff;border:3px solid var(--murekkep);border-radius:22px;padding:18px;box-shadow:var(--golge);width:100%}
.giris .gkart .gunad{color:var(--kazak);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:13px}
.giris .gkart h2{font-size:32px;margin:4px 0 10px}
.giris .gkart p{margin:0;font-size:16px;line-height:1.4}
.giris .mecitsoz{display:flex;align-items:flex-end;gap:8px;width:100%}
.giris .mecitsoz img{width:96px}
.giris .mecitsoz .balon{flex:1;text-align:left;margin-bottom:24px}

/* Sonuç */
.sonuc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.sonuc .yildizlar{font-size:54px;letter-spacing:4px}
.sonuc .yildizlar span{display:inline-block;animation:pop .4s backwards}
.sonuc .puan{font-family:"Baloo 2";font-weight:800;font-size:44px;color:var(--kazak)}
.sonuc .butonlar{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}

/* 1: Redaksiyon */
.redak{flex:1;display:flex;flex-direction:column;padding:0 12px 12px;gap:10px;min-height:0}
.redak .mecitbar{display:flex;align-items:flex-end;gap:8px}
.redak .mecitbar img{width:74px}
.redak .mecitbar .balon{flex:1;margin-bottom:10px;font-size:14px;min-height:42px}
.sayfa{flex:1;background:#fffdf7;border:2px solid #d9cba8;border-radius:6px;padding:16px 16px 18px;box-shadow:0 6px 18px rgba(0,0,0,.12);position:relative;overflow:auto;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.9}
.sayfa .sbaslik{font-family:system-ui;font-weight:800;font-size:12px;letter-spacing:1px;color:var(--gri);text-transform:uppercase;border-bottom:1px solid #e6dcc3;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between}
.kel{display:inline-block;padding:0 3px;margin:0 -1px;border-radius:5px;cursor:pointer}
.kel:active{background:rgba(45,108,223,.12)}
.kel.duzeldi{background:rgba(47,143,91,.15);color:var(--yesil);font-weight:700}
.kel.duzeldi s{color:var(--kirmizi);font-weight:400;font-size:.8em;margin-right:4px;opacity:.8}
.kel.yanlistik{animation:titre .3s;background:rgba(192,57,43,.18)}
.basdamga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.basdamga div{font-family:"Baloo 2";font-weight:800;font-size:38px;color:var(--yesil);border:5px solid var(--yesil);border-radius:14px;padding:4px 18px;transform:rotate(-12deg);background:rgba(255,255,255,.85);animation:damga .35s ease-out}
@keyframes damga{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.ilerleme{height:8px;background:#e3d6b6;border-radius:9px;overflow:hidden}
.ilerleme div{height:100%;background:var(--yesil);width:0;transition:width .3s}

/* 2: Sohbet */
.sohbet{flex:1;display:flex;flex-direction:column;padding:0 12px 12px;gap:8px;min-height:0}
.anlatici{display:flex;gap:8px;align-items:flex-start}
.anlatici img{width:82px;flex:none}
.hikaye{flex:1;height:130px;overflow:hidden;font-size:14.5px;display:flex;flex-direction:column;justify-content:flex-end}
.hikaye p{margin:0 0 4px}
.hikaye p:last-child{font-weight:800}
.ofis{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;position:relative;min-height:0}
.koltuk{position:relative;background:#e9dcbf;border:2.5px solid var(--murekkep);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px;overflow:visible}
.koltuk .masa{position:absolute;left:6px;right:6px;bottom:6px;height:22px;background:#cdb88d;border-radius:6px}
.koltuk .kisi{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;transition:transform .2s;margin-bottom:12px}
.koltuk .kisi .emoji{font-size:46px}
.koltuk .kisi img{width:58px;height:58px}
.koltuk .isim{position:relative;z-index:1;font-weight:800;font-size:12px;background:#fff;border:1.5px solid var(--murekkep);border-radius:8px;padding:0 6px;margin-top:-4px}
.koltuk.kaciyor{background:#ffd9cf;animation:titre .4s infinite}
.koltuk.kaciyor .kisi{transform:translateY(-14px) rotate(-8deg)}
.koltuk .bar{position:absolute;top:6px;left:8px;right:8px;height:7px;background:rgba(0,0,0,.12);border-radius:9px;overflow:hidden;display:none}
.koltuk.kaciyor .bar{display:block}
.koltuk .bar div{height:100%;background:var(--kirmizi);width:0}
.koltuk .bahane{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--murekkep);border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700;white-space:nowrap;z-index:3;display:none}
.koltuk.kaciyor .bahane{display:block}
.koltuk.bos .kisi{opacity:0}
.koltuk.bos::after{content:"💨 Kaçtı!";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--gri)}
.kacanlar{font-size:20px;letter-spacing:2px}

/* 3: Ata */
.ata{flex:1;display:flex;flex-direction:column;padding:0 12px 14px;gap:10px;min-height:0}
.sahne3{position:relative;flex:1;min-height:0}
.s3kisi{position:absolute;display:flex;flex-direction:column;align-items:center}
.s3kisi .isim{font-weight:800;font-size:13px;background:#fff;border:2px solid var(--murekkep);border-radius:8px;padding:0 8px;margin-top:-6px;position:relative}
.s3berk{left:0;top:4px}
.s3berk .emoji{font-size:64px}
.s3mecit{left:50%;transform:translateX(-50%);bottom:0}
.s3mecit img{width:120px}
.s3ata{right:0;top:4px}
.s3ata img{width:92px}
.s3balon{position:absolute;font-size:14.5px}
.s3balon.berkb{left:78px;right:96px;top:0}
.s3balon.mecitb{left:4px;right:4px;top:118px;text-align:center;background:#fff7e0;white-space:pre-line;z-index:2}
.cevaplar{display:flex;gap:10px}
.cevaplar .btn{flex:1;font-size:22px;padding:16px}
.zamanbar{height:8px;background:#e3d6b6;border-radius:9px;overflow:hidden}
.zamanbar div{height:100%;background:var(--kazak);width:100%}

/* 4: Kayınvalide */
.kv{flex:1;display:flex;flex-direction:column;padding:0 12px 14px;gap:10px;min-height:0}
.salon{position:relative;flex:1;min-height:220px;border:3px solid var(--murekkep);border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,#e9c99b 0 62%,#9c6b43 62% 100%)}
.salon .duvar{position:absolute;left:0;right:0;top:62%;height:6px;background:#6e4a2e}
.salon .kapi{position:absolute;left:10px;bottom:24%;width:62px;height:120px;background:#6e3f22;border:3px solid var(--murekkep);border-radius:6px 6px 0 0}
.salon .kapi::after{content:"";position:absolute;right:8px;top:55%;width:8px;height:8px;border-radius:50%;background:var(--sari)}
.salon .kapi span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-weight:800;font-size:12px;background:var(--yesil);color:#fff;padding:1px 6px;border-radius:6px;white-space:nowrap}
.salon .koltukk{position:absolute;right:6px;bottom:22%;font-size:72px;line-height:1}
.salon .tv{position:absolute;right:30%;top:14%;font-size:40px;opacity:.5}
.salon .tv.acik{opacity:1;animation:nabiz .3s infinite alternate;cursor:pointer}
.salon .cerceve{position:absolute;left:42%;top:10%;font-size:34px}
.anne{position:absolute;bottom:20%;font-size:70px;line-height:1;transition:left .08s linear;transform:translateX(-50%);z-index:2}
.annebalon{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:14px;width:72%;text-align:center;padding:6px 10px;z-index:3}
.annebalon::before{content:'👵🏻 ';}
.cay{position:absolute;font-size:46px;z-index:4;animation:pop .25s;cursor:pointer;filter:drop-shadow(0 0 8px #fff)}
.kvalt{display:flex;align-items:center;gap:10px}
.kvalt img{width:84px}
.kvalt .btn{flex:1;font-size:28px;padding:20px 10px;border-radius:22px}
.mesafe{height:14px;background:#e3d6b6;border-radius:9px;overflow:hidden;border:2px solid var(--murekkep)}
.mesafe div{height:100%;background:var(--yesil);width:0}

/* 5: Cuma */
.cuma{flex:1;display:flex;flex-direction:column;padding:0 12px 10px;gap:8px;min-height:0}
.sokak{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:10px;min-height:0}
.dukkan{position:relative;border:3px solid var(--murekkep);border-radius:10px 10px 4px 4px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.dukkan .tabela{background:var(--kazak);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:14px;text-align:center;padding:2px 0;position:relative;z-index:3;border-bottom:3px solid var(--murekkep)}
.dukkan .ic{flex:1;display:flex;align-items:center;justify-content:center;font-size:40px;background:repeating-linear-gradient(90deg,#fff6df 0 14px,#fbefd0 14px 28px)}
.dukkan .kepenk{position:absolute;left:0;right:0;top:27px;height:0;z-index:2;
  background:repeating-linear-gradient(180deg,#b9b9b9 0 7px,#8e8e8e 7px 9px);border-bottom:3px solid #555}
.dukkan.kapali .kepenk{height:calc(100% - 27px)!important;border-bottom:0}
.dukkan.kapali::after{content:"🔒 KAPALI";position:absolute;left:0;right:0;top:55%;text-align:center;z-index:4;font-weight:800;font-size:13px;color:#fff;text-shadow:0 1px 2px #000}
.dukkan .esnafb{position:absolute;left:4px;right:4px;bottom:6px;z-index:5;font-size:11.5px;padding:3px 6px;border-radius:10px;text-align:center;display:none}
.dukkan .esnafb.goster{display:block}
.cumaalt{display:flex;align-items:flex-end;gap:8px;height:92px}
.cumaalt img{height:92px}
.cumaalt .balon{flex:1;margin-bottom:22px;font-size:16px;font-weight:800}

/* 6: Batak */
.batak{flex:1;display:flex;flex-direction:column;padding:0 8px 8px;min-height:0}
.masa6{flex:1;position:relative;background:radial-gradient(ellipse at center,#2f8f5b 0%,#1f6b42 75%);border:4px solid #6e3f22;border-radius:26px;margin:2px 4px 8px;min-height:250px}
.oyuncu{position:absolute;display:flex;flex-direction:column;align-items:center;gap:1px;z-index:3}
.oyuncu .emoji{font-size:38px}
.oyuncu .ad{background:#fff;border:2px solid var(--murekkep);border-radius:8px;font-size:11px;font-weight:800;padding:0 6px;white-space:nowrap}
.oyuncu .el{background:var(--sari);border:2px solid var(--murekkep);border-radius:999px;font-size:12px;font-weight:800;padding:0 7px}
.oyuncu.sira .ad{background:var(--sari)}
.p1{left:4px;top:50%;transform:translateY(-60%)} .p2{left:50%;top:4px;transform:translateX(-50%)} .p3{right:4px;top:50%;transform:translateY(-60%)}
.oyuncu .lbalon{position:absolute;top:100%;margin-top:4px;font-size:11.5px;width:130px;padding:4px 7px;border-radius:12px;text-align:center;z-index:9}
.p1 .lbalon{left:0} .p3 .lbalon{right:0} .p2 .lbalon{left:50%;transform:translateX(-50%)}
.p0b{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:12px;width:220px;text-align:center;padding:4px 8px;z-index:9}
.kart{width:44px;height:64px;background:#fff;border:2px solid var(--murekkep);border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1;box-shadow:0 2px 0 rgba(0,0,0,.25);position:relative}
.kart .s{font-size:22px}
.kart.k{color:#c0392b}
.orta{position:absolute;left:50%;top:50%;width:0;height:0}
.orta .kart{position:absolute;transition:all .25s ease-out}
.orta .kart.o0{left:-22px;top:4px} .orta .kart.o1{left:-74px;top:-32px} .orta .kart.o2{left:-22px;top:-70px} .orta .kart.o3{left:30px;top:-32px}
.orta .kart.kazandi{box-shadow:0 0 0 4px var(--sari)}
.el6{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:136px;align-content:flex-start;padding:0 2px}
.el6 .kart{cursor:pointer;transition:transform .1s}
.el6 .kart.yasak{opacity:.4;filter:grayscale(.6)}
.el6.benim .kart:not(.yasak){box-shadow:0 0 0 2px var(--sari),0 3px 0 rgba(0,0,0,.25);transform:translateY(-3px)}
.batakust{display:flex;align-items:center;gap:8px;padding:0 4px 6px}
.batakust img{width:52px}
.batakust .bilgi{flex:1;font-size:13px;font-weight:700;line-height:1.25}
.ihale{position:absolute;inset:0;background:rgba(20,40,28,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:20;border-radius:22px;color:#fff;text-align:center;padding:12px}
.ihale .sayilar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ihale .sayilar .btn{width:56px;padding:10px 0;font-size:24px}
.iltifat{background:#e84a7f;font-size:15px;padding:8px 12px}

/* Final */
.final{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.final img{height:34vh;max-height:300px}
.final .unvan{font-family:"Baloo 2";font-weight:800;font-size:30px;color:var(--kazak)}
.konfeti{position:absolute;top:-20px;font-size:22px;animation:dus linear forwards;pointer-events:none;z-index:60}
@keyframes dus{to{transform:translateY(110vh) rotate(540deg)}}
.ses{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:70;background:#fff;border:2px solid var(--murekkep);border-radius:12px;width:40px;height:40px;font-size:18px}
/* ---- v2: büyük karakterler, 3D his ---- */
.kwrap{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.kwrap::after{content:"";position:absolute;bottom:-4px;left:12%;right:12%;height:12px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);z-index:-1}
.karakter{display:block;object-fit:contain;filter:drop-shadow(0 6px 5px rgba(0,0,0,.3));transform-origin:50% 100%;animation:nefes 2.4s ease-in-out infinite}
@keyframes nefes{0%,100%{scale:1 1}50%{scale:1.02 .98}}
.karakter.zipla{animation:zipla .35s ease-out,nefes 2.4s ease-in-out .35s infinite}
@keyframes zipla{0%{scale:1}35%{scale:1.12 .88}65%{scale:.94 1.08}100%{scale:1}}
/* 3D görsel gelene kadar fotoğrafla ifade taklidi */
.karakter[data-ifade=konusma]{animation:konus .18s ease-in-out infinite alternate}
@keyframes konus{from{scale:1 1}to{scale:1.03 .95}}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============ Temel ============ */
const IMG={mecit:'assets/mecit.png',yan:'assets/mecit_yan.png',boy:'assets/mecit_boy.png',ata:'assets/ata.png'};
/* 3D karakter görselleri: eklenenler buraya yazılır (anahtar: kim-ifade). Yoksa fotoğraf kullanılır. */
const GORSEL_3D={
 'mecit-normal':'assets/3d/mecit-konusma.webp','mecit-konusma':'assets/3d/mecit-konusma.webp','mecit-kizgin':'assets/3d/mecit-kizgin.webp',
 'mecit-capkin':'assets/3d/mecit-capkin.webp','mecit-saskin':'assets/3d/mecit-saskin.webp','mecit-mutlu':'assets/3d/mecit-mutlu.webp',
 'ata-normal':'assets/3d/ata-saskin.webp','ata-saskin':'assets/3d/ata-saskin.webp','ata-dogru':'assets/3d/ata-dogru.webp',
 'ata-yanlis':'assets/3d/ata-yanlis.webp','ata-uyuyor':'assets/3d/ata-uyuyor.webp',
};
const $=(s,r=document)=>r.querySelector(s);
const app=$('#app');
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const karistir=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function dokun(e,fn){e.addEventListener('pointerdown',ev=>{ev.preventDefault();fn(ev)});return e}

const T={ids:[],raf:0,
  after(ms,fn){const id=setTimeout(fn,ms);this.ids.push(id);return id},
  every(ms,fn){const id=setInterval(fn,ms);this.ids.push(id);return id},
  loop(fn){let last=performance.now();const step=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;if(fn(dt)!==false)this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)},
  temizle(){this.ids.forEach(i=>{clearTimeout(i);clearInterval(i)});this.ids=[];cancelAnimationFrame(this.raf)}};

const KAYIT_ANAHTAR='mecitAbi.v2';
let kayit={yildiz:{},puan:{},oynandi:{}};
try{const k=JSON.parse(localStorage.getItem(KAYIT_ANAHTAR));if(k&&k.yildiz)kayit=k}catch(e){}
function kaydet(){try{localStorage.setItem(KAYIT_ANAHTAR,JSON.stringify(kayit))}catch(e){}}

/* ============ Karakterler ============ */
const FOTO={mecit:IMG.mecit,ata:IMG.ata};
const IFADE_EMOJI={kizgin:'💢',capkin:'😉',saskin:'❓',mutlu:'✨',uyuyor:'💤',dogru:'👍',yanlis:'👎'};
function kimg(kim,ifade){return GORSEL_3D[kim+'-'+ifade]||GORSEL_3D[kim+'-normal']||FOTO[kim]}
function karakter(kim,ifade='normal',cls=''){
  const w=h('div','kwrap '+cls);const i=h('img','karakter');i.alt=kim;i.dataset.kim=kim;w.appendChild(i);w.img=i;
  ifadeYap(w,ifade,false);return w}
function ifadeYap(w,ifade,anim=true){
  const i=w.img;const kim=i.dataset.kim;const gercek=!!GORSEL_3D[kim+'-'+ifade];
  const src=kimg(kim,ifade);if(i.getAttribute('src')!==src)i.src=src;
  i.dataset.ifade=gercek?(ifade==='konusma'?'konusma':''):ifade;
  const eski=w.querySelector('.ifadeemoji');if(eski)eski.remove();
  if(!gercek&&IFADE_EMOJI[ifade])w.appendChild(h('div','ifadeemoji',IFADE_EMOJI[ifade]));
  if(anim){i.classList.remove('zipla');void i.offsetWidth;i.classList.add('zipla')}
}
/* foto yoksa emoji; 3D görseli eklenmişse resim */
function yan(kim,emoji,boyut=60){const g=GORSEL_3D[kim+'-normal'];if(g){const i=h('img','yankarakter');i.src=g;i.style.width=i.style.height=boyut+'px';return i}const d=h('div','emoji',emoji);d.style.fontSize=(boyut*.8)+'px';return d}
function yanHTML(kim,emoji,boyut=60){return yan(kim,emoji,boyut).outerHTML}

/* ============ Ses ============ */
let AC=null,sesAcik=true;
try{sesAcik=localStorage.getItem('mecitAbi.ses')!=='0'}catch(e){}
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function bip(f=440,d=.08,tip='square',v=.04,gecikme=0,f2=null){
  if(!sesAcik||!ac())return;
  try{const t=AC.currentTime+gecikme,o=AC.createOscillator(),g=AC.createGain();
    o.type=tip;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
let gurBuf=null;
function gurultu(d=.3,{f=1000,f2=null,q=1,v=.15,tip='lowpass',gecikme=0}={}){
  if(!sesAcik||!ac())return;
  try{if(!gurBuf){gurBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const x=gurBuf.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1}
    const t=AC.currentTime+gecikme,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=gurBuf;fl.type=tip;fl.Q.value=q;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t,Math.random());s.stop(t+d+.02)}catch(e){}}
const SES={
  iyi(){bip(660,.07,'square',.04);bip(990,.1,'square',.04,.06)},
  kotu(){bip(180,.18,'sawtooth',.05)},
  zirt(){bip(110,.35,'sawtooth',.09,0,55);gurultu(.3,{f:200,tip:'lowpass',v:.12})},       // osuruk gibi hata sesi
  konus(){for(let i=0;i<3;i++)bip(rnd(140,240),.05,'triangle',.05,i*.06)},
  bagir(){bip(300,.12,'sawtooth',.05);bip(420,.15,'sawtooth',.05,.08)},
  tik(){bip(900,.03,'square',.025)},
  pat(){gurultu(.12,{f:900,tip:'lowpass',v:.35});bip(90,.15,'sine',.25)},               // tokat / tıp
  kazan(){[523,659,784,1046].forEach((f,i)=>bip(f,.16,'square',.04,i*.1))},
  kaybet(){[392,330,262,196].forEach((f,i)=>bip(f,.25,'triangle',.06,i*.18))},
  kart(){gurultu(.06,{f:2500,tip:'highpass',v:.12})},
  kepenk(){for(let i=0;i<6;i++)gurultu(.06,{f:rnd(500,900),tip:'bandpass',q:3,v:.18,gecikme:i*.07})},
  kepenkAc(){for(let i=0;i<4;i++)gurultu(.05,{f:rnd(900,1400),tip:'bandpass',q:3,v:.15,gecikme:i*.05})},
  kilit(){gurultu(.25,{f:300,tip:'lowpass',v:.4});bip(70,.3,'sine',.3)},
  vin(){gurultu(1.2,{f:300,f2:4000,tip:'bandpass',q:1.5,v:.25})},                         // süpürge uçuşu
  alkis(){for(let i=0;i<22;i++)gurultu(.04,{f:rnd(1200,2500),tip:'bandpass',q:1,v:.12,gecikme:rnd(0,1.4)})},
  tv(){gurultu(.4,{f:3000,tip:'highpass',v:.08})},
  horul(){bip(80,.6,'sawtooth',.06,0,60);gurultu(.6,{f:400,tip:'lowpass',v:.06})}
};
function titret(ms=30){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

 /* FİNAL */

};
const sesTampon={};let sesYuklendi=false,sesKaynak=null;
function sesleriYukle(){
  if(sesYuklendi||!ac())return;sesYuklendi=true;
  Object.keys(SOZ).forEach(id=>{
    const src=SES_GOMULU?SES_GOMULU[id]:'assets/ses/'+id+'.mp3';if(!src)return;
    fetch(src).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()})
      .then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)))
      .then(buf=>{sesTampon[id]=buf}).catch(()=>{});
  });
}
document.addEventListener('pointerdown',()=>sesleriYukle(),true);
function sus(){if(sesKaynak){try{sesKaynak.stop()}catch(e){}sesKaynak=null}}
function soyle(id,{kes=true}={}){
  const buf=sesTampon[id];if(!sesAcik||!buf||!AC)return false;
  if(sesKaynak&&!kes)return false;
  try{sus();if(AC.state==='suspended')AC.resume();
    const k=AC.createBufferSource();k.buffer=buf;k.connect(AC.destination);
    k.onended=()=>{if(sesKaynak===k)sesKaynak=null};k.start();sesKaynak=k;return true}catch(e){return false}
}
function de(id,o){soyle(id,o);return SOZ[id]}
function deRast(ids,o){return de(pick(ids),o)}

/* ============ Yardımcılar ============ */
function ucanYazi(parent,x,y,yazi,renk){const u=h('div','ucan',yazi);u.style.left=x+'px';u.style.top=y+'px';u.style.color=renk||'var(--yesil)';parent.appendChild(u);setTimeout(()=>u.remove(),900)}
function ucanOlay(ev,yazi,renk){const r=app.getBoundingClientRect();ucanYazi(app,(ev&&ev.clientX||r.left+r.width/2)-r.left-20,(ev&&ev.clientY||r.top+r.height/2)-r.top-30,yazi,renk)}
function balonYaz(el,yazi){el.textContent=yazi;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function sesButonu(){const b=h('button','ses',sesAcik?'🔊':'🔇');dokun(b,()=>{sesAcik=!sesAcik;if(!sesAcik)sus();b.textContent=sesAcik?'🔊':'🔇';try{localStorage.setItem('mecitAbi.ses',sesAcik?'1':'0')}catch(e){}});return b}
function ekran(sinif=''){T.temizle();sus();app.innerHTML='';const e=h('div','ekran '+sinif);app.appendChild(e);return e}
function ustBar(ekr,baslik,geri=haftaEkrani){
  const u=h('div','ust');const g=h('button','geri','‹');dokun(g,()=>geri());u.append(g,h('div','baslik',baslik));ekr.appendChild(u);return u}
function hud(ust,{sure=null,puan=true}={}){
  const o={};
  if(puan){o.p=h('div','chip','0');ust.appendChild(o.p)}
  if(sure!=null){o.s=h('div','chip sure','⏱ '+sure);ust.appendChild(o.s)}
  o.puan=v=>{if(o.p)o.p.textContent=v};
  o.sure=v=>{if(!o.s)return;o.s.textContent='⏱ '+Math.max(0,Math.ceil(v));o.s.classList.toggle('uyari',v<=5)};
  return o;
}

/* ============ Günler ============ */
const GUNLER=[
 {id:'pzt',gun:'Pazartesi',ad:'Baskıya Gitmeden',ikon:'📝',acik:'Yanlış yazılmış kelimelere dokun!',sozId:'06',oyun:()=>oyunRedaksiyon()},
 {id:'sal',gun:'Salı',ad:'Kısa Bir Şey Anlatıcam',ikon:'🗣️',acik:'Kaçmaya çalışana dokun, yerine oturt!',sozId:'12',oyun:()=>oyunSohbet()},
 {id:'car',gun:'Çarşamba',ad:'Ata, Bu Ne Diyor?',ikon:'🤔',acik:'Sen Ata\'sın. Berk doğru mu söylüyor?',sozId:'24',oyun:()=>oyunAta()},
 {id:'per',gun:'Perşembe',ad:'Git Artık Anne!',ikon:'🧹',acik:'Bas bas bas! Kayınvalideyi kapıya götür.',sozId:'29',oyun:()=>oyunKayinvalide()},
 {id:'cum',gun:'Cuma',ad:'Niye Kapadın?!',ikon:'🏪',acik:'Kepengi inen dükkana dokun, açtır!',sozId:'36',oyun:()=>oyunCuma()},
 {id:'cmt',gun:'Cumartesi',ad:'Acıbadem Batağı',ikon:'🃏',acik:'7 kartlık kısa batak. Koz maça. Sözünü tut!',sozId:'41',oyun:()=>oyunBatak()},
];
function gunAcikMi(i){return i===0||!!kayit.oynandi[GUNLER[i-1].id]}

/* ============ Kapak ============ */
function kapak(){
  const e=ekran('kapak');e.appendChild(sesButonu());
  e.append(h('div','',`<div class="damga">BASKIYA HAZIR DEĞİL</div><h1 style="margin-top:12px">MECİT ABİ</h1><div class="alt">Redaksiyonun Efendisi</div>`));
  const g=h('div','govde');
  const boy=GORSEL_3D['mecit-normal']||IMG.boy;
  g.innerHTML=`<img class="yuz karakter" src="${boy}" alt="Mecit Abi"><div class="balon">${SOZ['01']}</div>`;
  dokun(g,()=>{soyle('01');const i=g.querySelector('img');i.classList.remove('zipla');void i.offsetWidth;i.classList.add('zipla')});
  e.appendChild(g);
  const alt=h('div','');alt.style.cssText='display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px';
  const b=h('button','btn','Haftaya Başla ▶');dokun(b,()=>{SES.iyi();haftaEkrani();T.after(150,()=>soyle('02'))});
  alt.append(b,h('div','',`<small style="color:var(--gri);font-weight:700">69 yaşında · redaktör · durmadan konuşur</small>`));
  e.appendChild(alt);
}

/* ============ Hafta ============ */
function haftaEkrani(){
  const e=ekran();ustBar(e,'Mecit Abi\'nin Haftası',kapak);e.appendChild(sesButonu());
  const top=GUNLER.reduce((s,g)=>s+(kayit.puan[g.id]||0),0);
  const ys=GUNLER.reduce((s,g)=>s+(kayit.yildiz[g.id]||0),0);
  e.appendChild(h('div','toplam',`<span>Toplam puan: ${top}</span><span>⭐ ${ys} / 18</span>`));
  const l=h('div','hafta');
  GUNLER.forEach((g,i)=>{
    const acik=gunAcikMi(i),y=kayit.yildiz[g.id]||0;
    const b=h('button','gun'+(acik?'':' kilit'));
    b.innerHTML=`<div class="ikon">${acik?g.ikon:'🔒'}</div><div class="bilgi"><div class="gunad">${g.gun}</div><div class="oyunad">${g.ad}</div></div>
      <div class="yildiz">${kayit.oynandi[g.id]?'⭐'.repeat(y)+'<span style="opacity:.25">'+'⭐'.repeat(3-y)+'</span>':''}</div>`;
    dokun(b,()=>{if(!acik){SES.zirt();b.classList.add('titre');setTimeout(()=>b.classList.remove('titre'),300);return}SES.tik();girisEkrani(i)});
    l.appendChild(b);
  });
  if(GUNLER.every(g=>kayit.oynandi[g.id])){const f=h('button','btn yesil','🏆 Hafta Sonu Karnesi');dokun(f,finalEkrani);l.appendChild(f)}
  e.appendChild(l);
}

function girisEkrani(i){
  const g=GUNLER[i];const e=ekran();ustBar(e,g.gun);
  const gi=h('div','giris');
  gi.innerHTML=`<div class="gkart"><div class="gunad">${g.gun}</div><h2>${g.ikon} ${g.ad}</h2><p>${g.acik}</p></div>`;
  const by=h('div','buyuk');const m=karakter('mecit','konusma');const bl=h('div','balon pop',SOZ[g.sozId]);by.append(m,bl);gi.appendChild(by);
  dokun(by,()=>{soyle(g.sozId);ifadeYap(m,'konusma')});
  T.after(250,()=>soyle(g.sozId));T.after(2600,()=>ifadeYap(m,'normal',false));
  const b=h('button','btn','Başla!');b.style.width='100%';b.style.maxWidth='300px';
  dokun(b,()=>{SES.iyi();g.oyun()});gi.appendChild(b);e.appendChild(gi);
}

function sonucEkrani(gunId,puan,yildiz,mesaj,sesId){
  puan=Math.max(0,Math.round(puan));
  const i=GUNLER.findIndex(g=>g.id===gunId),g=GUNLER[i];
  const rekor=puan>(kayit.puan[gunId]||0);
  kayit.oynandi[gunId]=true;
  kayit.yildiz[gunId]=Math.max(kayit.yildiz[gunId]||0,yildiz);
  kayit.puan[gunId]=Math.max(kayit.puan[gunId]||0,puan);kaydet();
  if(yildiz>0){SES.kazan();if(yildiz>=2)T.after(300,SES.alkis)}else{SES.kaybet();T.after(700,SES.zirt)}
  T.after(800,()=>soyle(sesId||(yildiz>=2?'03':yildiz===1?'04':'05')));

function metinCoz(t){
  const parca=[];const re=/\[([^|\]]+)\|([^\]]+)\](\S*)|(\S+)/g;let m;
  while((m=re.exec(t))){if(m[4])parca.push({y:m[4]});else parca.push({y:m[1]+m[3],d:m[2]+m[3],hata:true})}
  return parca;
}

  const ESNAF=['Cuma abi, cuma!','Abi ben de insanım!','Yine mi sen ya!','Tamam abi, ağlama açtım.','Sana ekmek yok abi!','Abi kepenk kendi indi!','Polisi arıyorum!','Annemin günü abi!'];
  let sure=SURE,puan=0,kapanan=0,bitti=false;
  const dk=DUKKANLAR.map(d=>{
    const el=h('div','dukkan');el.innerHTML=`<div class="tabela">${d.ad}</div><div class="ic">${d.e}${yanHTML('esnaf','👨🏻',34)}</div><div class="kepenk"></div>`;
    const eb=h('div','balon esnafb','');el.appendChild(eb);sk.appendChild(el);
    const s={el,eb,k:0,hiz:0,bekle:rnd(1,5),kapali:false,ebT:0};
    dokun(el,ev=>{
      if(bitti||s.kapali)return;
      if(s.k>0.04){
        const kaz=Math.round(30+s.k*90);puan+=kaz;H.puan(puan);ucanOlay(ev,'+'+kaz);
        s.k=0;s.hiz=0;s.bekle=rnd(1.5,4);s.el.querySelector('.kepenk').style.height='0';
        const id=pick(MECIT);balonYaz(mb,SOZ[id]);if(!soyle(id,{kes:false}))SES.bagir();SES.kepenkAc();titret(20);
        yanImg.classList.remove('zipla');void yanImg.offsetWidth;yanImg.classList.add('zipla');
        eb.textContent=pick(ESNAF);eb.classList.add('goster');s.ebT=1.3;
      }else SES.tik();
    });
    return s;
  });
  function son(){
    bitti=true;
    T.after(700,()=>{
      const acik=6-kapanan;const kazandi=kapanan<3;
      const y=!kazandi?0:kapanan===0?3:kapanan===1?2:1;
      sonucEkrani('cum',puan+(kazandi?acik*150:0),y,kazandi?`${acik} dükkan açık! Esnaf benden korkuyor, olması gereken bu.`:'Bütün sokak kapandı. Pazartesi hepsini tek tek arayacağım!');
    });
  }
  T.loop(dt=>{
    if(bitti)return false;
    sure-=dt;H.sure(sure);
    const zorluk=1-sure/SURE;
    dk.forEach(s=>{
      if(s.ebT>0){s.ebT-=dt;if(s.ebT<=0)s.eb.classList.remove('goster')}
      if(s.kapali)return;
      if(s.hiz===0){s.bekle-=dt;if(s.bekle<=0){s.hiz=1/rnd(4.8-zorluk*1.8,6-zorluk*2);SES.kepenk()}}
      else{
        s.k+=s.hiz*dt;
        s.el.querySelector('.kepenk').style.height=`calc(${Math.min(1,s.k)} * (100% - 27px))`;
        if(s.k>=1){s.kapali=true;s.el.classList.add('kapali');kapanan++;kp.textContent=`🔒 ${kapanan}/3`;SES.kilit();titret(80);balonYaz(mb,de('40'));if(kapanan>=3)son()}
      }
    });
    if(sure<=0&&!bitti)son();
  });
}

/* ============ 6) CUMARTESİ: Batak (7 kart) ============ */
const RENK=['♠','♥','♦','♣'];const RAD={11:'J',12:'Q',13:'K',14:'A'};
const HANIMLAR=[null,{ad:'Nermin Hanım',kim:'nermin',e:'👩🏼‍🦳'},{ad:'Sevim Hanım',kim:'sevim',e:'💁🏻‍♀️'},{ad:'Gönül Hanım',kim:'gonul',e:'👵🏽'}];
const ILTIFAT=[['44',3,'Kocam duyarsa seni batak masasına gömer!'],['45',2,'Hi hi, ihtiyar çapkın!'],['46',1,'Mecit, oyna şu kartı, yaşlanıyoruz!']];
const DEDIKODU=['Mecit Bey, eşiniz arıyor!','Bu çay demsiz, Sevim yine cimrilik etmiş.','Üst kattaki Necla uzaylılarla kaçmış.','Mecit Bey, kayınvaliden gitti mi?','Kızlar, haftaya bende. Pasta yok.'];
function kartAd(c){return (RAD[c.r]||c.r)}
function kartEl(c){return h('div','kart'+(c.s==='♥'||c.s==='♦'?' k':''),`<div>${kartAd(c)}</div><div class="s">${c.s}</div>`)}
function deste(){const d=[];RENK.forEach(s=>{for(let r=2;r<=14;r++)d.push({s,r})});return karistir(d)}
function sirala(el){const o={'♠':0,'♥':1,'♣':2,'♦':3};return el.sort((a,b)=>o[a.s]-o[b.s]||a.r-b.r)}
function yener(c,best){return (c.s===best.s&&c.r>best.r)||(c.s==='♠'&&best.s!=='♠')}
function enIyi(trick){let b=trick[0];for(const t of trick)if(yener(t.c,b.c))b=t;return b}
function yasal(el,trick,kirildi){
  if(!trick.length){const non=el.filter(c=>c.s!=='♠');return (kirildi||!non.length)?el:non}
  const led=trick[0].c.s;const f=el.filter(c=>c.s===led);
  const best=enIyi(trick).c;
  if(f.length){const yuksek=f.filter(c=>yener(c,best));return yuksek.length?yuksek:f}
  const sp=el.filter(c=>c.s==='♠');if(sp.length){const yuksek=sp.filter(c=>yener(c,best));return yuksek.length?yuksek:sp}
  return el;
}
function aiSec(el,trick,kirildi){
  const L=yasal(el,trick,kirildi).slice().sort((a,b)=>a.r-b.r);
  if(!trick.length){const as=L.filter(c=>c.r>=13&&c.s!=='♠');return as.length?as[as.length-1]:L[0]}
  const best=enIyi(trick).c;const kaz=L.filter(c=>yener(c,best));
  const sir=(a,b)=>(a.s==='♠')-(b.s==='♠')||a.r-b.r;
  return (kaz.length?kaz:L).sort(sir)[0];
}
function oyunBatak(){
  const KART=7;
  const e=ekran();const u=ustBar(e,'Acıbadem Batağı');const H=hud(u);
  const w=h('div','batak');e.appendChild(w);
  const ust=h('div','batakust');const mec=karakter('mecit','capkin');ust.appendChild(mec);
  const bilgi=h('div','bilgi','Koz: ♠');const ilt=h('button','btn iltifat','😏 İltifat (3)');ust.append(bilgi,ilt);w.appendChild(ust);
  const masa=h('div','masa6');w.appendChild(masa);
  const orta=h('div','orta');masa.appendChild(orta);
  const ozel=[null];
  for(let p=1;p<=3;p++){
    const o=h('div','oyuncu p'+p);o.innerHTML=`${yanHTML(HANIMLAR[p].kim,HANIMLAR[p].e,48)}<div class="ad">${HANIMLAR[p].ad}</div><div class="el">0 el</div>`;
    const lb=h('div','balon lbalon');lb.style.display='none';o.appendChild(lb);masa.appendChild(o);ozel.push({o,lb});
  }
  const p0b=h('div','balon p0b');p0b.style.display='none';masa.appendChild(p0b);
  const elDiv=h('div','el6');w.appendChild(elDiv);
  const d=deste();const eller=[0,1,2,3].map(i=>sirala(d.slice(i*KART,i*KART+KART)));
  let alinan=[0,0,0,0],trick=[],sira=0,kirildi=false,soz=0,iltifatHak=3,gonul=0,bitti=false,mecitBekliyor=false,elNo=0;
  const balonT={};
  function konustur(p,yazi,ms=2200){
    const b=p===0?p0b:ozel[p].lb;b.textContent=yazi;b.style.display='block';b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
    clearTimeout(balonT[p]);balonT[p]=setTimeout(()=>{b.style.display='none'},ms);T.ids.push(balonT[p]);
  }
  function bilgiYaz(){bilgi.innerHTML=`Koz: <b>♠</b> · Söz: <b>${soz||'?'}</b> · Aldığın: <b>${alinan[0]}</b><br>Gönül puanı: ${gonul} 💕`;
    for(let p=1;p<=3;p++)ozel[p].o.querySelector('.el').textContent=alinan[p]+' el'}
  function siraGoster(){for(let p=1;p<=3;p++)ozel[p].o.classList.toggle('sira',sira===p&&!bitti)}
  function eliCiz(){
    elDiv.innerHTML='';
    const L=mecitBekliyor?yasal(eller[0],trick,kirildi):[];
    elDiv.classList.toggle('benim',mecitBekliyor);
    eller[0].forEach(c=>{
      const k=kartEl(c);const ok=L.includes(c);if(mecitBekliyor&&!ok)k.classList.add('yasak');
      dokun(k,()=>{
        if(!mecitBekliyor)return;
        if(!ok){SES.zirt();k.classList.add('titre');setTimeout(()=>k.classList.remove('titre'),300);
          const led=trick[0]&&trick[0].c.s;
          konustur(0,!trick.length?'Maça kırılmadan maça açılmaz Mecit!':eller[0].some(x=>x.s===led)?`${led} atacaksın, yükselterek!`:'Kozun var, koz at!',1800);return}
        mecitBekliyor=false;oyna(0,c);
      });
      elDiv.appendChild(k);
    });
  }
  function oyna(p,c){
    eller[p].splice(eller[p].indexOf(c),1);
    if(c.s==='♠')kirildi=true;
    trick.push({p,c});SES.kart();
    const k=kartEl(c);k.classList.add('o'+p);k.style.opacity='0';k.style.transform='scale(.6)';orta.appendChild(k);
    requestAnimationFrame(()=>{k.style.opacity='1';k.style.transform='scale(1)'});
    if(p===0)eliCiz();
    if(p===0&&c.s==='♠'&&trick.length>1&&trick[0].c.s!=='♠')konustur(ri(1,3),'Mecit yine koz kesti, Allah\'ın cezası!');
    if(trick.length===4)T.after(600,eliBitir);else{sira=(p+1)%4;T.after(p===3?250:550,siradaki)}
  }
  function siradaki(){
    siraGoster();
    if(sira===0){mecitBekliyor=true;eliCiz();return}
    T.after(200,()=>oyna(sira,aiSec(eller[sira],trick,kirildi)));
  }
  function eliBitir(){
    const kaz=enIyi(trick).p;alinan[kaz]++;elNo++;
    [...orta.children].forEach(k=>{if(k.classList.contains('o'+kaz))k.classList.add('kazandi')});
    if(kaz===0){SES.pat();ifadeYap(mec,'mutlu');konustur(0,deRast(['42','43'],{kes:false}),1400)}
    else{ifadeYap(mec,'kizgin',false);if(Math.random()<.4)konustur(kaz,pick(DEDIKODU))}
    bilgiYaz();
    T.after(850,()=>{
      orta.innerHTML='';trick=[];sira=kaz;ifadeYap(mec,'capkin',false);
      if(elNo>=KART)return son();
      siradaki();
    });
  }
  function son(){
    bitti=true;siraGoster();
    const tuttu=alinan[0]>=soz;
    const puan=tuttu?soz*300+(alinan[0]-soz)*60+gonul:alinan[0]*50+gonul;
    const y=tuttu?(soz>=3?3:2):(alinan[0]>=soz-1?1:0);
    T.after(500,()=>sonucEkrani('cmt',puan,y,tuttu
      ?`${soz} dedim, ${alinan[0]} aldım! Hanımlar bayıldı. Gönül puanı: ${gonul} 😏`
      :`${soz} dedim, ${alinan[0]} aldım. Batık! Hep o güzel gözler yüzünden.`,tuttu?'48':'47'));
  }
  dokun(ilt,()=>{
    if(iltifatHak<=0||bitti||!soz)return;
    iltifatHak--;ilt.textContent=`😏 İltifat (${iltifatHak})`;if(!iltifatHak)ilt.disabled=true;
    const [id,p,cvp]=ILTIFAT[2-iltifatHak];konustur(0,SOZ[id],2600);ifadeYap(mec,'capkin');if(!soyle(id))SES.konus();
    T.after(1500,()=>{konustur(p,cvp,2200);gonul+=50;bilgiYaz();SES.iyi()});
  });
  eliCiz();bilgiYaz();
  const ih=h('div','ihale');
  const guc=eller[0].reduce((s,c)=>s+(c.r>=14?1:c.r===13?.6:c.r===12&&c.s==='♠'?.5:0)+(c.s==='♠'?.3:0),0);
  const oneri=Math.max(1,Math.min(5,Math.round(guc)));
  ih.innerHTML=`<h2 style="font-size:26px">Kaç el alırsın?</h2><div style="font-size:15px;opacity:.9">Önerim: <b>${oneri}</b></div>`;
  const ss=h('div','sayilar');
  for(let n=1;n<=5;n++){const b=h('button','btn'+(n===oneri?' yesil':''),String(n));dokun(b,()=>{soz=n;ih.remove();bilgiYaz();SES.iyi();
    konustur(0,n>=4?`${n}! Bugün iddialıyım.`:`${n} diyorum. Mütevazıyım ben.`);
    T.after(700,()=>{konustur(2,'Aç bakalım çapkın.');sira=0;siradaki()})});ss.appendChild(b)}
  ih.appendChild(ss);masa.appendChild(ih);
}

  const top=GUNLER.reduce((s,g)=>s+(kayit.puan[g.id]||0),0);
  const ys=GUNLER.reduce((s,g)=>s+(kayit.yildiz[g.id]||0),0);

  for(let i=0;i<40;i++){const k=h('div','konfeti',pick(['🎉','⭐','📝','🃏','💕','🧹','🛸']));k.style.left=rnd(0,100)+'%';k.style.animationDuration=rnd(2.2,4.5)+'s';k.style.animationDelay=rnd(0,1.5)+'s';app.appendChild(k);setTimeout(()=>k.remove(),6500)}
}
